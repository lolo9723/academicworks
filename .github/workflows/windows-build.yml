name: Windows VSTO build and installer

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'THIRD-PARTY-NOTICES.md'
      - 'licenses/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check startup diagnostic harness
        run: |
          New-Item artifacts -ItemType Directory -Force | Out-Null
          .\build\Probe-Startup.ps1 -Payload . -ReportPath artifacts\diagnostic-preflight.json
          $probe=Get-Content artifacts\diagnostic-preflight.json -Raw | ConvertFrom-Json
          if($probe.components.Count -ne 1 -or $probe.components[0] -notmatch '^FRAMEWORK_LOAD:FAIL:FileNotFoundException:'){throw 'Diagnostic helper failed before the expected missing-payload check.'}
      - name: .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Java JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare official VSTO tools
        run: .\build\Prepare-WindowsCI.ps1
      - name: Build, test and package
        run: .\build\Build-Windows.ps1
      - name: Measure real paragraph output and process memory
        run: dotnet run --project tools/AcademicParaphraser.QualityProbe/AcademicParaphraser.QualityProbe.csproj -c Release -- artifacts/lexical-data/kenet.sqlite runtime/java/bin/java.exe nlp/target/turkish-nlp-1.0.0.jar artifacts/quality
      - name: Verify live keyless dictionary and structure retrieval
        run: dotnet run --project tools/AcademicParaphraser.QualityProbe/AcademicParaphraser.QualityProbe.csproj -c Release -- artifacts/lexical-data/kenet.sqlite runtime/java/bin/java.exe nlp/target/turkish-nlp-1.0.0.jar artifacts/quality --online
      - name: Verify clinical sentence rewrites with word replacement disabled
        run: dotnet run --project tools/AcademicParaphraser.QualityProbe/AcademicParaphraser.QualityProbe.csproj -c Release -- artifacts/lexical-data/kenet.sqlite runtime/java/bin/java.exe nlp/target/turkish-nlp-1.0.0.jar artifacts/quality --clinical
      - name: Verify Windows runtime and deployment
        run: .\build\Verify-WindowsRuntime.ps1 -Payload artifacts\payload
      - name: Reproduce SQLite failure under Framework shadow copy
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -STA -ExecutionPolicy Bypass -File .\build\Probe-Startup.ps1 -Payload artifacts\payload -ShadowCopy -SkipNativeBootstrap -ReportPath artifacts\shadow-baseline-verification.json
          if($LASTEXITCODE -ne 0){throw 'Shadow-copy baseline harness failed.'}
          $baseline=Get-Content artifacts\shadow-baseline-verification.json -Raw | ConvertFrom-Json
          if($baseline.assemblyStorage -ne 'SHADOW' -or $baseline.components -notcontains 'DATABASE:FAIL:Exception:80131500' -or $baseline.failureOrigins -notcontains 'SITE:DATABASE:SQLitePCL.NativeLibrary.Load'){throw 'The suspected SQLite shadow-copy failure was not reproduced.'}
      - name: Verify real Framework payload startup in x64 and x86
        run: |
          foreach($architecture in @('x64','x86')){
            $systemFolder=if($architecture -eq 'x64'){'System32'}else{'SysWOW64'}
            $powershell=Join-Path $env:WINDIR "$systemFolder\WindowsPowerShell\v1.0\powershell.exe"
            foreach($storage in @('shadow','direct')){
              $arguments=@('-NoProfile','-STA','-ExecutionPolicy','Bypass','-File','.\build\Probe-Startup.ps1','-Payload','artifacts\payload','-ReportPath',"artifacts\startup-$storage-$architecture-verification.json",'-Strict')
              if($storage -eq 'shadow'){$arguments+='-ShadowCopy'}
              & $powershell @arguments
              if($LASTEXITCODE -ne 0){throw "Framework startup failed: $architecture $storage"}
            }
          }
      - name: Verify installer and write SHA256
        run: |
          $installer=Get-Item artifacts\installer\AkademikParafraz-1.3.0-Setup.exe
          if($installer.Length -lt 1000000){throw 'Installer çıktısı beklenenden küçük.'}
          $hash=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ASCII "$($installer.FullName).sha256"
          @'
          Bu paket gerçek Windows derlemesinden üretilmiştir.
          VSTO manifestleri geçici geliştirme sertifikası ile imzalanmıştır.
          Yayıncı sertifikası: publisher.cer. Özel anahtar bu pakete dahil değildir.
          Bu CI makinesinde Microsoft Word yoktur; Ribbon, biçim, hyperlink,
          Undo ve Track Changes kabulü build/Smoke-Word.ps1 ile gerçek Word'de
          ayrıca yapılmalıdır. Bu paket üretim kabulünü tamamlamış sayılmaz.
          '@ | Set-Content -Encoding UTF8 artifacts\installer\KURULUMU-OKU.txt
          Copy-Item artifacts\payload\publisher.cer artifacts\installer
          Copy-Item build\Smoke-Word.ps1,build\Verify-Word.cmd,build\Probe-Startup.ps1,build\Tanila.cmd artifacts\installer
          Copy-Item docs\UsersGuide.md artifacts\installer
      - name: Test missing-Word prerequisite
        run: .\build\Test-InstallerPrerequisites.ps1 -Installer artifacts\installer\AkademikParafraz-1.3.0-Setup.exe
      - name: Create bounded transfer parts
        run: |
          $source=Get-Item artifacts\installer\AkademikParafraz-1.3.0-Setup.exe
          New-Item artifacts\transfer -ItemType Directory -Force | Out-Null
          $stream=[IO.File]::OpenRead($source.FullName)
          $buffer=New-Object byte[] (1024*1024)
          $index=0
          try{
            while($stream.Position -lt $stream.Length){
              $index++
              $destination=Join-Path (Get-Location) ('artifacts\transfer\Setup.part'+$index.ToString('00'))
              $output=[IO.File]::Create($destination)
              $bytes=0
              try{
                while($bytes -lt 20*1024*1024 -and $stream.Position -lt $stream.Length){
                  $read=$stream.Read($buffer,0,[Math]::Min($buffer.Length,20*1024*1024-$bytes))
                  if($read -le 0){throw 'Installer aktarım parçası okunamadı.'}
                  $output.Write($buffer,0,$read);$bytes+=$read
                }
              }finally{$output.Dispose()}
            }
          }finally{$stream.Dispose()}
          if($index -lt 2 -or $index -gt 3){throw 'Installer aktarım parçası sayısı beklenenden farklı.'}
      - name: Transfer part 01
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Windows-Setup-part01
          path: artifacts/transfer/Setup.part01
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Transfer part 02
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Windows-Setup-part02
          path: artifacts/transfer/Setup.part02
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Transfer part 03
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Windows-Setup-part03
          path: artifacts/transfer/Setup.part03
          compression-level: 0
          if-no-files-found: warn
          retention-days: 30
      - name: Installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AkademikParafraz-1.3.0-Windows-Setup
          path: artifacts/installer/
          if-no-files-found: error
          retention-days: 30
      - name: Verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-build-evidence
          path: |
            artifacts/tests/*.trx
            artifacts/*.binlog
            artifacts/*.log
            artifacts/payload-inventory.json
            artifacts/lexical-data/lexical-data-verification.json
            artifacts/quality/*.json
            artifacts/*-verification.json
            artifacts/payload/*.vsto
            artifacts/payload/*.manifest
            artifacts/installer/*.sha256
            artifacts/installer/publisher.cer
            artifacts/installer/KURULUMU-OKU.txt
          if-no-files-found: warn
          retention-days: 30
